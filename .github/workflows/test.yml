# CI for the Universal Pensions Uganda demo platform.
#
# Runs on PRs targeting `main` and on pushes to `main`. Two jobs:
#   1. lint-and-unit  → fast feedback (ESLint + vitest, ~30s).
#   2. e2e            → Playwright smoke + flow specs (~3 min). Gated on
#                       lint-and-unit so we don't burn browser time on a broken
#                       PR.
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   • VITE_SUPABASE_URL          — public Supabase project URL
#   • VITE_SUPABASE_ANON_KEY     — public anon key
#   • SUPABASE_SERVICE_ROLE_KEY  — server-only key for DB verification fixtures
#   • SUPABASE_JWT_SECRET        — HS256 secret for minting test JWTs
#
# Note: VERCEL_PROJECT_ID / VERCEL_ORG_ID are intentionally NOT used here.
# Frontend auto-deploys to Vercel are driven by the Vercel GitHub App (push to
# main, not GHA), so dropping these secrets does NOT break the deploy pipeline.
# Backend deploys to Render via Render's own GitHub integration / Deploy Hook.
#
# Note on shared DB: e2e flow specs write to the shared Supabase project
# (ilkhfnoyxlxwqadebnkp) and clean up in `afterEach`. We run with --workers=1
# below so concurrent runs in the same job don't race on the same rows; the
# `concurrency` block at workflow level cancels in-flight runs on the same ref
# so a follow-up push pre-empts the previous one.
#
# Delta gate (A09-002 / A25-011, docs/audits/2026-08-23/a25/ci-guard.md): as of
# the 2026-08-23 audit, 30 Playwright tests fail DETERMINISTICALLY (not
# flakily — see docs/audits/2026-08-23/00-baseline.md §10) and will keep
# failing until Phase 7 fixes them one by one. Gating on the raw
# `playwright test` exit code can therefore never go green — that is exactly
# why every one of the last 41 pushes to main showed CI as cancelled/red with
# nobody investigating. Both Playwright run steps below now run with
# `continue-on-error: true` + `--reporter=json` and hand their JSON report to
# `scripts/e2e-delta.mjs`, which is the actual gate: it passes iff every
# failure this run is already in the frozen allowlist at
# docs/audits/2026-08-23/a25/baseline-failures.txt, and fails (listing them)
# on any NEW failure. See that script's header comment for the full contract.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force JavaScript-based actions to use Node 24 (Node 20 is deprecated from
# 2026-09-16; runners force Node 24 by default from 2026-06-02). Opting in
# now keeps behaviour stable across the transition window.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      # A25-007 added e2e/tsconfig.json and a `typecheck` script specifically
      # because e2e/*.ts was never type-checked by anything. Nothing then ran
      # it: CI does lint, test, build and build:api only. Two real implicit-any
      # errors sit suppressed behind a check nobody invoked.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # --coverage so Phase-6 F3 can enforce a coverage threshold on CI.
        run: npm test -- --coverage

      - name: Build (Vite frontend)
        # Gates the Vite frontend build (~5s) so a bad import / Vite-incompatible
        # syntax fails the PR here rather than surfacing only at Vercel deploy
        # post-merge. CI otherwise runs only build:api (the e2e job). (F-G17)
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-and-unit
    # A09-002: was 20. The full matrix (`npx playwright test --workers=1`, all
    # 4 projects) alone measures 24.4-26.0 min LOCALLY WITH ZERO RETRIES
    # (docs/audits/2026-08-23/00-baseline.md §10: "Runtime 24.4 min"; a25/
    # pw-rerun2.txt: "306 passed (26.0m)") — already past the old 20-minute
    # ceiling before a single dependency installs. Confirmed live: run
    # 31484332571 (headSha bd637f6, the current HEAD) was cancelled at
    # exactly 20m16s wall time with the full-matrix step still in flight
    # (11:00:49→cancelled 11:19:39) and every downstream step (§15-M1 guard,
    # both artifact uploads) skipped as a result — repeated on 41/41 push
    # runs (`gh run list --workflow=test.yml --limit 60`), so this guard has
    # never actually executed against main. CI additionally runs with
    # `retries: 1` (playwright.config.ts:51, `CI ? 1 : 0`) on top of the ~30
    # currently-failing tests the local baseline didn't retry, plus job
    # overhead the 24.4 min figure doesn't include: checkout, npm ci,
    # build:api type-check, the Playwright browser cache/install step (can
    # run several minutes on a cache miss), the separate §15-M1 db-only
    # re-run below (its own fresh webServer boot), and 2 artifact uploads.
    # 50 min leaves real headroom over that realistic worst case without
    # being open-ended.
    # 50 -> 75 (2026-08-29), and the real fix is `retries: 0` in
    # playwright.config.ts, applied at the same time.
    #
    # THE CEILING WAS NEVER THE PROBLEM. The first attempt at this raised 50->75
    # on the estimate that 22 known-failing tests were being retried at 75s each
    # (~27.5 min on top of a ~26 min baseline = ~53.5 min). That estimate used
    # the delta-gate ALLOWLIST size as the failure count. It is not the failure
    # count. Measured from run 33234910374's log: 82 distinct tests fail today,
    # against an allowlist of 22. The retry cost is therefore ~102 min, not
    # ~27.5, and the job needs ~128 min — which is why it was cancelled at 50,
    # then again at 75m18s.
    #
    # Setup is not the problem: checkout through browser install is 59s total.
    #
    # With retries off the matrix should land near its ~26 min baseline (slower
    # on a GitHub runner than the local machine it was measured on), so 75 is now
    # generous headroom rather than a target. Left at 75 deliberately — the job
    # has never once completed on main (6 consecutive cancellations here, and
    # 41/41 before that at the old 20 min ceiling), so the first complete run is
    # worth paying for.
    #
    # EXPECT THIS TO GO RED. `continue-on-error: true` covers the matrix step but
    # NOT the delta gate below, which is the real gate. 82 failures against a
    # 22-entry allowlist means it will report ~60 as NEW and fail the job. That
    # is the gate working for the first time in a month, not a regression: the
    # allowlist was frozen on 2026-08-23 and the suite has drifted since. Fix by
    # re-freezing the baseline or fixing the tests — not by restoring retries.
    #
    # Still worth doing later: shard the 4 Playwright projects across parallel
    # jobs — same tests, same semantics, ~4x less wall clock; needs the delta
    # gate to merge per-shard JSON.
    timeout-minutes: 75
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_USE_SUPABASE: 'true'
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      # Vite reads this at dev-server boot; Playwright's webServer block
      # (npm run dev:all) starts both Vite :5173 and Express :3001 in
      # parallel, so the frontend must point at the local Express, not
      # the production Render URL.
      VITE_API_BASE_URL: 'http://localhost:3001/api'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check server build
        # Catches NodeNext import drift (e.g. missing `.js` extensions) at PR
        # review time rather than at Render deploy time. ~15s — cheap insurance.
        # tsc -p server/tsconfig.json walks every TS file under api/ and server/,
        # so missing extensions or @vercel/node type breaks fail loudly here.
        run: npm run build:api

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers + system deps
        # On PRs we run the chromium + mobile-chromium projects only — fast
        # feedback. On pushes to `main` we run the full Chromium + WebKit
        # matrix (smoke + flow + regression + db). The install step covers
        # both so a single cache key serves both jobs.
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright smoke + flow + db specs (PR — chromium + mobile-chromium)
        if: github.event_name == 'pull_request'
        # PR feedback path: smoke covers every dashboard route per role,
        # flow specs exercise the write+DB chain. We also gate the db/ guards
        # (cross-tenant RLS isolation, money RPC idempotency, schema invariants)
        # on PRs — they are service-role-only (~7 fast queries, no UI/browser,
        # so they add only seconds) and catch security/money regressions before
        # merge rather than only post-merge on main (§15-H1). Two projects only
        # so we stay under the 5-min-per-combo SLA from §6.H of the audit plan.
        #
        # continue-on-error + --reporter=json: this subset already overlaps
        # several of the 30 known-baseline failures (e.g. mobile-chromium ×
        # smoke/subscriber-dashboard), so a raw non-zero exit here would fail
        # every PR on pre-existing, already-triaged breakage. The "Delta gate"
        # step right below is the real gate (A09-002 / A25-011).
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: pr-results.json
        run: |
          npx playwright test e2e/specs/smoke e2e/specs/flows e2e/specs/db \
            --project=chromium --project=mobile-chromium \
            --workers=1 \
            --reporter=json,github,html

      - name: Delta gate (PR — only NEW failures block the merge)
        if: github.event_name == 'pull_request'
        # Gates on the DELTA, not the suite's exit code: passes iff every
        # failure above is already in the frozen allowlist at
        # docs/audits/2026-08-23/a25/baseline-failures.txt. See
        # scripts/e2e-delta.mjs's header comment for the full contract.
        run: node scripts/e2e-delta.mjs pr-results.json

      - name: Run Playwright full matrix (main post-merge — chromium + webkit, smoke + flow + regression + db)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Full matrix: every project × every spec. The DB invariants run
        # against the live `ilkhfnoyxlxwqadebnkp` project (service-role
        # query), so this also guarantees the schema state is intact after
        # each merge to main.
        #
        # continue-on-error + --reporter=json: see the PR step above — the
        # suite is expected to exit 1 at the current baseline (§10 of
        # 00-baseline.md), so its raw exit code must not be what fails the
        # job. The "Delta gate" step right below is the real gate.
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: |
          npx playwright test --workers=1 --reporter=json,github,html

      - name: Delta gate (push — only NEW failures block main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/e2e-delta.mjs e2e-results.json

      - name: Assert db/ specs actually executed (not silently skipped) (§15-M1)
        # A25-011: was `if: github.event_name == 'push' && github.ref ==
        # 'refs/heads/main'` — i.e. this guard ran ONLY on push-to-main, never
        # on the PR job just above, even though that PR step deliberately
        # includes e2e/specs/db specifically to "catch security/money
        # regressions before merge rather than only post-merge on main
        # (§15-H1)". A fork PR, or any run while a secret is rotating/unset,
        # silently lost every cross-tenant RLS / money-idempotency guard on
        # exactly the surface that gates merges, and still showed green.
        # `always()` (rather than reinstating the push-main check, or nothing
        # at all) also means this step survives the Playwright run step above
        # failing/soft-failing on baseline noise — it does NOT survive the
        # whole JOB being cancelled (GitHub Actions stops scheduling further
        # steps on a hard cancellation regardless of `if:`), which is exactly
        # the A09-002 failure mode; the raised timeout above is what actually
        # fixes that half of the problem.
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: db-results.json
        run: |
          # `|| true` so the guard below ALWAYS runs. GitHub's default shell is
          # `bash -e`, so a single genuine db failure aborted this step before
          # its own check — the guard was only ever reachable on an all-green
          # run, i.e. the case it least needed to inspect. The full-matrix step
          # above already reports db test verdicts through the delta gate; this
          # step exists solely to catch the SILENT-SKIP pathology.
          npx playwright test e2e/specs/db \
            --project=chromium \
            --workers=1 \
            --reporter=json || true
          node -e '
            const fs = require("fs");
            const file = process.env.PLAYWRIGHT_JSON_OUTPUT_NAME;
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            const { expected = 0, skipped = 0, unexpected = 0, flaky = 0 } = report.stats || {};
            // executed = ran to completion, REGARDLESS of pass/fail verdict.
            // Deliberately NOT just `expected` (A25-011 suggested tightening
            // "expected < 1" to "expected < 13", but expected alone only
            // counts PASSED-as-expected tests — a run where every db/ test
            // executed and one genuinely FAILED would show expected < total
            // too, and this step would then print the misleading "all
            // skipped or none discovered" message for an unrelated real
            // failure that the full-matrix step above already caught). This
            // guard exists to catch ONLY the silent-skip pathology, so it
            // must count unexpected + flaky as "executed" alongside expected.
            const executed = expected + unexpected + flaky;
            // ⚠️ 17 WAS WRONG BY 40, AND THE RECIPE FOR RE-DERIVING IT WAS WRONG TOO.
            // Measured 2026-08-25: `npx playwright test e2e/specs/db
            // --project=chromium --list` reports 57 tests in 5 files —
            // deactivate-entities 4, invariants 13 (its comment said 8),
            // money-idempotency 2, rls-isolation 3, and
            // function-deployment-contract 35, of which 33 are LOOP-GENERATED
            // and therefore invisible to the documented
            // `grep -c "^\s*test("` recipe (which yields 24, also not 17).
            //
            // The gap was not cosmetic. function-deployment-contract gates on
            // SUPABASE_DB_URL while the other four gate on
            // SUPABASE_SERVICE_ROLE_KEY — two independent skip keys. With the
            // service-role key missing (the exact scenario this step's own
            // error text names), 22 tests skip — every cross-tenant RLS check,
            // both money-idempotency checks, every schema invariant — and 35
            // still execute. 35 >= 17, so the step printed a pass. Any single
            // db spec file could vanish entirely and this guard would not
            // notice.
            //
            // Counting per FILE instead of a single total, so a whole file
            // dropping out cannot be masked by another file being large.
            const PER_FILE_MIN = {
              "deactivate-entities.spec.ts": 4,
              "invariants.spec.ts": 13,
              "money-idempotency.spec.ts": 2,
              "rls-isolation.spec.ts": 3,
              "function-deployment-contract.spec.ts": 1,
              // Unitization redesign (0143-0157). Added because the floor above
              // is per-FILE precisely so a whole file cannot vanish unnoticed —
              // and these three arrived after it was written, so all three were
              // invisible to it. pricing-engine-lifecycle is the one that
              // matters most: it is the ONLY thing anywhere that actually
              // executes price_pending_transactions. Every other guard on the
              // engine is a regex over text. If it silently skips, the money
              // path has no behavioural coverage at all and nothing says so.
              "dealing-date-property.spec.ts": 3,
              "unitization-surface.spec.ts": 6,
              "pricing-engine-lifecycle.spec.ts": 8,
            };
            const ranByFile = {};
            (function walk(node) {
              for (const spec of node.specs || []) {
                const f = (spec.file || "").split("/").pop();
                for (const t of spec.tests || []) {
                  if (t.status !== "skipped") ranByFile[f] = (ranByFile[f] || 0) + 1;
                }
              }
              for (const c of node.suites || []) walk(c);
            })({ suites: report.suites || [] });
            const shortfall = Object.entries(PER_FILE_MIN)
              .filter(([f, min]) => (ranByFile[f] || 0) < min)
              .map(([f, min]) => `${f}: ${ranByFile[f] || 0}/${min}`);
            if (shortfall.length > 0) {
              console.error(
                "§15-M1 FAILURE: db spec file(s) did not execute their minimum: " +
                shortfall.join(", ") +
                ". A missing secret silently skips a whole file; a per-file floor " +
                "catches that where a single grand total could not."
              );
              process.exit(1);
            }
            const REQUIRED_DB_TESTS = Object.values(PER_FILE_MIN).reduce((a, b) => a + b, 0);
            console.log(`db/ specs — executed: ${executed}/${REQUIRED_DB_TESTS} (expected: ${expected}, unexpected: ${unexpected}, flaky: ${flaky}, skipped: ${skipped})`);
            if (executed < REQUIRED_DB_TESTS) {
              console.error(
                `§15-M1 FAILURE: only ${executed}/${REQUIRED_DB_TESTS} db/ specs executed ` +
                `(${skipped} skipped). This usually means a required secret ` +
                "(SUPABASE_SERVICE_ROLE_KEY / VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY / " +
                "SUPABASE_JWT_SECRET) is missing, so the RLS / money-idempotency / invariant " +
                "guards did NOT fully run — whole-suite or partial skip, either way."
              );
              process.exit(1);
            }
          '

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces + screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
