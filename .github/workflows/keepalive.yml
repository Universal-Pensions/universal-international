# Wake-pinger for the Render free-tier backend (audit B7).
#
# GitHub Actions' cron has 5–15 min real-world jitter; running every 10 min
# widens the margin against Render's 15-min spin-down so two jittered fires
# stay <15 min apart. cron-job.org or UptimeRobot is configured separately as
# a 5-min backup. Both should be set to email the team on failure (audit G59).

name: Render keepalive

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 min
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /readyz
        run: |
          set -euo pipefail
          # /readyz performs one real read against Supabase (unlike /healthz,
          # which is deliberately I/O-free for the platform's own liveness
          # probe — see server/index.ts:95-97). Pinging /readyz here means
          # this cron both generates the DB activity that defers the
          # Supabase free-tier auto-pause and actually goes red when the DB
          # is unreachable, instead of staying green through an outage
          # (audit A09-001). Do not point this back at /healthz.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://uganda-dashboard-api.onrender.com/readyz")
          if [ "$code" != "200" ]; then
            echo "Render /readyz returned HTTP $code"
            exit 1
          fi
          echo "Render /readyz ok"
