# Render Blueprint — uganda-dashboard backend
#
# IMPORTANT INVARIANTS:
# - region: singapore is IMMUTABLE after service creation (audit B14).
#   Supabase is hosted in ap-southeast-1 (Singapore, cutover 2026-06-05); the
#   Render→Supabase hop is now intra-region while keeping Uganda→Render latency
#   reasonable.
# - autoDeployTrigger: off mirrors the CLAUDE.md §1 guardrail:
#   "auto-deploy on push to main — do not push without explicit approval".
# - SUPABASE_JWT_SECRET MUST be copied verbatim from the Supabase project
#   (Dashboard → API → JWT Settings). Rotating it during the migration
#   silently fails-open under withOptionalAuth (audit B21).

services:
  - type: web
    name: uganda-dashboard-api
    runtime: node                                           # B6
    plan: free
    region: singapore                                       # B14 — IRREVERSIBLE
    branch: main                                            # G14 — swapped to main at cutover (was cleanup/post-audit-2026-05-26)
    autoDeployTrigger: off                                  # G14
    healthCheckPath: /healthz                               # G16
    # A09-006 — RESOLVED 2026-08-25. The live service had drifted from this line
    # (it was missing `--include=dev`); the build command was corrected in the
    # Render dashboard and re-verified via the API, and now matches exactly.
    #
    # `--include=dev` is load-bearing: `NODE_ENV: production` is set below, and npm
    # honours that by skipping devDependencies — which would drop @types/*,
    # @vercel/node and tsx, all of which `npm run build:api` needs to COMPILE.
    # (`npm prune --omit=dev` then removes them after the build. Needed to build,
    #  not to run.) If this line and the dashboard ever disagree again, the
    #  dashboard is what actually runs.
    #
    # Corrected from the original comment: it said "@sentry/* are devDeps". Only
    # @sentry/REACT is, and it is a FRONTEND package Vercel builds, not Render.
    # @sentry/NODE — the one this service uses — is a regular dependency.
    buildCommand: npm ci --include=dev && npm run build:api && npm prune --omit=dev   # G15
    startCommand: node dist-server/server/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"                                         # B6 — under envVars, not inline shell
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION                          # belt-and-suspenders for `npm ci` devDeps
        value: "false"
      - key: PORT
        value: "3001"
      - key: SUPABASE_URL                                   # G19 — server uses non-VITE name
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET                            # B21 — COPY VERBATIM
        sync: false
      - key: SENTRY_DSN
        sync: false
