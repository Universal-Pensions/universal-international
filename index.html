    <!-- Self-hosted brand typefaces (A24-002 / A09-004): same two Google Fonts
         families, same files, served same-origin from public/fonts/ instead of
         fonts.googleapis.com / fonts.gstatic.com. Preloading the two variable
         font files (they cover every weight this app uses) starts the font
         fetch in parallel with CSSOM construction instead of waiting for
         fonts.css to be parsed first — also closes A17-009 (no preload). No
         preconnect needed now that both origins are gone. -->
    <link rel="preload" href="/fonts/inter-v20-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-v12-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
